name: Parameterized Manual Workflow

on:
  workflow_dispatch:
    inputs:
      application_name:
        description: 'Application Name'
        required: true
        type: string
      run_validation:
        description: 'Run Validation'
        required: true
        type: boolean
        default: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.val-step.outputs.validation_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate inputs
        id: val-step
        run: |
          echo "Application Name: ${{ github.event.inputs.application_name }}"
          echo "Run Validation: ${{ github.event.inputs.run_validation }}"
          
          if [ "${{ github.event.inputs.run_validation }}" == "true" ]; then
            echo "validation_status=success" >> $GITHUB_OUTPUT
          else
            echo "validation_status=skipped" >> $GITHUB_OUTPUT
          fi

  summary:
    needs: validate
    if: needs.validate.outputs.validation_status == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Execution Summary
        run: |
          echo "Validation succeeded! Executing summary for application: ${{ github.event.inputs.application_name }}"
